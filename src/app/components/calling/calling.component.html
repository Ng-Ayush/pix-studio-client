    <main class="main-content">
        <div class="border-l border-white bg-[#494CA2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7 items-center">
                    <div class="logo-img">
                        <img [src]="userData?.studio_icon" alt="" class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, {{userData?.studio_name}}</h2>
                    </div>
                </div>
            </div>
            <div class="back-btn flex items-center py-3 px-10 bg-[#E3E7F1]">
                <a class="flex items-center cursor-pointer" [routerLink]="['/dashboard']">
                    <button
                        class="cursor-pointer rounded p-2 hover:bg-[#494CA2] hover:text-white transition-colors duration-200 inline-flex items-center gap-2 justify-center"><svg
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="h-4 w-4">
                            <path
                                d="M8.83 6a30.23 30.23 0 0 0-5.62 5.406A.949.949 0 0 0 3 12m5.83 6a30.233 30.233 0 0 1-5.62-5.406A.949.949 0 0 1 3 12m0 0h18">
                            </path>
                        </svg> Go back</button>
                </a>
            </div>
        </div>

        <div class="w-full text-start mt-5 mb-5 px-5">
            <div class="add-button flex justify-center mb-10">
                <button
                    class="bg-[#494CA2] text-white rounded-md px-5 py-3 flex items-center gap-4 cursor-pointer transition-colors duration-200 hover:bg-[#494CA2]"
                    (click)="openModal();">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-12">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="block text-2xl">Add Agent</span>
                </button>
            </div>
            <div class="px-5 mb-20"> <!--overflow-y-scroll h-150 relative-->
                <div class="mb-6 flex gap-5">
                    <input type="text" autocomplete="off" placeholder="Search agent" (input)="search($event)"
                        class="bg-[#fff] w-full h-full px-4 py-2 rounded-md border border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                    <input type="text" placeholder="Select Date" onfocus="this.type='date'"
                        onblur="if(!this.value)this.type='text'" autocomplete="off" (change)="filterByDate($event)"
                        class="bg-[#fff] cursor-pointer w-1/3 h-full px-4 py-2 rounded-md border border-gray-300">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-6 sm:grid-cols-6 lg:grid-cols-5 gap-6">
                    <div class="card border-l-4 border-blue-500 border border-gray-200 p-6 rounded-md shadow-md w-full max-w-md mx-auto"
                        *ngFor="let agent of filteredAgents">
                        <!-- Top Row: Agent Name/Phone and Extension Number -->
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex flex-col items-start">
                                <h4 class="text-xl font-semibold text-gray-800">{{agent.agent_name | titlecase}}</h4>
                                <p class="text-xl text-gray-500">{{agent.agent_phone}}</p>
                            </div>
                            <div class="text-right">
                                <h4 class="font-semibold text-gray-800">Extension Number</h4>
                                <p class="text-xl text-gray-500">{{agent.extension_number}}</p>
                            </div>
                        </div>
                        <!-- Centered Created At -->
                        <div class="text-start my-2">
                            <h4 class="font-semibold text-gray-700">Created At</h4>
                            <p class="text-xl font-semibold text-blue-700">{{agent.created_at | date : 'fullDate'}}</p>
                        </div>
                        <!-- Centered Copy Button -->
                        <div class="flex justify-center mt-4">
                            <button (click)="copyAgentPhone(agent)"
                                class="bg-white rounded px-6 py-2 hover:bg-gray-100 shadow-md border border-gray-300 flex items-center gap-2 transition cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-copy">
                                    <rect width="13" height="13" x="9" y="9" rx="2" ry="2" />
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                                </svg>
                                <span class="text-gray-700 text-sm font-semibold">Copy Number</span>
                            </button>
                        </div>
                    </div>

                </div>
                <div class="h-[1px] w-full bg-gray-200" *ngIf="filteredAgents.length == 0">
                    <h1>No Agent Found</h1>
                </div>
            </div>
        </div>


    </main>
</div>

<div #modalContent
    class=" fixed inset-0 bg-[#000000a3] opacity-100 flex items-center justify-center z-50 transition-opacity duration-300 ease-in-outbg-gray-100 p-4 sm:p-8 flex justify-center items-start min-h-screen"
    *ngIf="agentModal">
    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-md" [ngClass]="{'modal-fade-in': agentModal}">
        <header class="flex justify-between items-center pb-4 mb-6 border-b border-gray-200">
            <h1 class="text-xl sm:text-2xl font-semibold text-gray-800">Add Agent</h1>
            <div class="flex items-center gap-4">
                <button aria-label="Settings" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.594 3.94c.09-.542.56-1.007 1.057-1.228a48.249 48.249 0 0 1 3.413 0c.497.221.967.686 1.057 1.228m0 0c0 .878-.587 1.683-1.408 2.008M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18Zm0 0a8.949 8.949 0 0 0 5.472-1.936C15.879 17.043 13.966 16.5 12 16.5c-1.966 0-3.879.543-5.472 1.564A8.949 8.949 0 0 0 12 21Zm0 0a9.003 9.003 0 0 0 4.372-1.126C15.001 18.79 13.27 18 12 18c-1.27 0-3.001.79-4.372 1.874A9.003 9.003 0 0 0 12 21Z" />
                    </svg>
                </button>
                <button (click)="closeModal()" aria-label="Close"
                    class="cursor-pointer text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-3">
            <div>
                <label for="partyName" class="block text-sm font-medium text-gray-700 mb-1">Agent Name
                    <span class="text-red-500">*</span>
                    <br>
                </label>
                <input type="text" autocomplete="off" [(ngModel)]="agentConfig.agent_name" id="partyName"
                    name="partyName"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1">Agent Phone
                    Number <span class="text-red-500">*</span></label>
                <input type="tel" maxlength="10" [(ngModel)]="agentConfig.agent_phone" id="phoneNumber"
                    name="phoneNumber"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
            <!-- <div>
                <label for="extension_number" class="block text-sm font-medium text-gray-700 mb-1">Extension
                    Number <span class="text-red-500">*</span></label>
                <input type="tel" maxlength="10" [(ngModel)]="agentConfig.extension_number" id="phoneNumber"
                    name="phoneNumber"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div> -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Agent Email
                </label>
                <input type="email" autocomplete="off" [(ngModel)]="agentConfig.email" id="email" name="partyName"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
        </div>

        <footer class="flex justify-end gap-4 pt-6 items-center mt-8 border-t border-gray-200">
            <button type="submit" (click)="createAgent()" [disabled]="isLoading"
                class="cursor-pointer px-6 py-2 bg-[#494CA2] text-white rounded-md text-sm font-medium hover:bg-[#494CA2] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Save
            </button>
            <span role="status" *ngIf="isLoading">
                <svg aria-hidden="true"
                    class="inline w-6 h-6 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600"
                    viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                        fill="currentColor" />
                    <path
                        d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                        fill="currentFill" />
                </svg>
            </span>
        </footer>
    </div>
</div>

<div *ngIf="showLogOutModal"
    class="fixed inset-0 bg-[#000000a3] opacity-100 flex items-center justify-center z-90 transition-opacity duration-300 ease-in-out">
    <div #modalContent
        class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform transition-all duration-300 ease-in-out"
        [ngClass]="{'modal-fade-in': showLogOutModal}">
        <div class="p-6 flex flex-col items-center">
            <div class="w-full max-w-[200px] mb-4">
                <img src="../../../assets/logout.png" alt="Delete illustration" class="w-full h-auto" />
            </div>

            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
                Are you sure you want to logout?
            </h2>
        </div>

        <div class="bg-gray-50 p-4 flex justify-center gap-5 rounded-b-lg">
            <button (click)="toggleLogoutModal()"
                class="cursor-pointer px-8 py-2 rounded-full bg-white text-gray-700 font-medium border border-gray-300 hover:bg-gray-100 transition-colors duration-200">
                Cancel
            </button>
            <button (click)="logout()"
                class="cursor-pointer px-8 py-2 rounded-full bg-red-600 text-white font-medium hover:bg-red-700 transition-colors duration-200">
                Logout
            </button>
        </div>
    </div>
</div>
