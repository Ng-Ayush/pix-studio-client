    <main class="main-content">
        <div class="border-l border-white bg-[#5758b2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7 items-center">
                    <div class="logo-img">
                        <img [src]="userData?.studio_icon" alt="" class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, {{userData?.studio_name}}</h2>
                    </div>
                </div>
            </div>
            <div class="back-btn flex items-center py-3 px-10 bg-gray-200">
                <a class="flex items-center cursor-pointer" [routerLink]="['/dashboard']">
                    <button
                        class="cursor-pointer rounded p-2 hover:bg-[#5758b2] hover:text-white transition-colors duration-200 inline-flex items-center gap-2 justify-center"><svg
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="h-4 w-4">
                            <path
                                d="M8.83 6a30.23 30.23 0 0 0-5.62 5.406A.949.949 0 0 0 3 12m5.83 6a30.233 30.233 0 0 1-5.62-5.406A.949.949 0 0 1 3 12m0 0h18">
                            </path>
                        </svg> Go back</button>
                </a>
            </div>
        </div>

        <div class="w-full text-center mt-5 mb-5 px-5">
            <div class="add-button flex justify-center mb-10">
                <button
                    class="bg-[#5758b2] text-white rounded-md px-5 py-3 flex items-center gap-4 cursor-pointer transition-colors duration-200 hover:bg-indigo-700"
                    (click)="openModal();">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-12">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    <span class="block text-2xl">Add Agent</span>
                </button>
            </div>
            <div class="px-5 mb-20"> <!--overflow-y-scroll h-150 relative-->
                <div class="mb-6">
                    <input type="text" autocomplete="off" placeholder="Search agent" (input)="search($event)"
                        class="bg-[#fff] w-full h-full px-4 py-2 rounded-md border border-gray-300 focus:border-blue-500 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-1/2">
                    <div class="card border-l-10 transition-border-color duration-200 border border-gray-200 p-5 rounded-md"
                        *ngFor="let agent of filteredAgents">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex flex-col items-start">
                                <h2 class="text-xl font-semibold text-gray-800">{{agent.agent_name|titlecase}}
                                </h2>
                                <p class="text-xl text-gray-500">{{agent.agent_phone}}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mb-4  gap-4 border-b border-gray-200 py-2">
                            <div (click)="copyAgentPhone(agent)"
                                class="bg-white rounded-full px-8 py-3 hover:bg-gray-100 shadow-md border border-gray-300 flex items-center gap-2 cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-copy">
                                    <rect width="13" height="13" x="9" y="9" rx="2" ry="2" />
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                                </svg>
                                <span class="text-gray-700 text-xs font-semibold">Copy Number</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="h-[1px] w-full bg-gray-200" *ngIf="filteredAgents.length == 0">
                    <h1>No Agent Found</h1>
                </div>
            </div>
        </div>


    </main>
</div>

<div #modalContent
    class=" fixed inset-0 bg-[#000000a3] opacity-100 flex items-center justify-center z-50 transition-opacity duration-300 ease-in-outbg-gray-100 p-4 sm:p-8 flex justify-center items-start min-h-screen"
    *ngIf="agentModal">
    <div class="bg-white p-6 sm:p-8 rounded-lg shadow-xl w-full max-w-md" [ngClass]="{'modal-fade-in': agentModal}">
        <header class="flex justify-between items-center pb-4 mb-6 border-b border-gray-200">
            <h1 class="text-xl sm:text-2xl font-semibold text-gray-800">Add Agent</h1>
            <div class="flex items-center gap-4">
                <button aria-label="Settings" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.594 3.94c.09-.542.56-1.007 1.057-1.228a48.249 48.249 0 0 1 3.413 0c.497.221.967.686 1.057 1.228m0 0c0 .878-.587 1.683-1.408 2.008M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18Zm0 0a8.949 8.949 0 0 0 5.472-1.936C15.879 17.043 13.966 16.5 12 16.5c-1.966 0-3.879.543-5.472 1.564A8.949 8.949 0 0 0 12 21Zm0 0a9.003 9.003 0 0 0 4.372-1.126C15.001 18.79 13.27 18 12 18c-1.27 0-3.001.79-4.372 1.874A9.003 9.003 0 0 0 12 21Z" />
                    </svg>
                </button>
                <button (click)="closeModal()" aria-label="Close"
                    class="cursor-pointer text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 gap-3">
            <div>
                <label for="partyName" class="block text-sm font-medium text-gray-700 mb-1">Agent Name
                    <span class="text-red-500">*</span>
                    <br>
                </label>
                <input type="text" autocomplete="off" [(ngModel)]="agentConfig.agentName" id="partyName"
                    name="partyName"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
            <div>
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700 mb-1">Agent Phone
                    Number <span class="text-red-500">*</span></label>
                <input type="tel" maxlength="10" [(ngModel)]="agentConfig.agentPhone" id="phoneNumber"
                    name="phoneNumber"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Agent Email
                </label>
                <input type="email" autocomplete="off" [(ngModel)]="agentConfig.email" id="email" name="partyName"
                    class="w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
            </div>
        </div>

        <footer class="flex justify-end gap-4 pt-6 mt-8 border-t border-gray-200">
            <button type="submit" (click)="createAgent()"
                class="cursor-pointer px-6 py-2 bg-indigo-600 text-white rounded-md text-sm font-medium hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Save
            </button>
        </footer>
    </div>
</div>
