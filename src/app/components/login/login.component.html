<div class="login-container flex flex-col items-center justify-center min-h-screen px-4">

    <div class="logo flex flex-col items-center mb-6">
        <div class="logo-icon mb-2">
            <img src="../../../assets/gif_logo.gif" alt="Logo" width="100" height="100" class="object-cover" />
        </div>
        <h1 class="text-xl sm:text-2xl font-semibold text-white-800">Welcome to MY STUDIO</h1>
    </div>

    <div class="form-group w-full max-w-sm mb-4">
        <label for="pin" class="form-label mb-2 block">Please enter your pin</label>
        <input type="text" id="pin" autocomplete="off" [(ngModel)]="loginPin" (input)="removeSpaces()" (keyup.enter)="handlePin()"
            placeholder="xxx-xxx" class="form-control w-full" />
    </div>

    <div class="form-group w-full max-w-sm mb-4" *ngIf="showOTPBox">
        <label for="otp" class="form-label mb-2 block">OTP</label>
        <input type="text" id="otp" autocomplete="off" [(ngModel)]="otp" (input)="removeOtpSpaces()" (input)="checkOtpMaxLength($event)"
            (keyup.enter)="handleOTP()" placeholder="xxx-xxx" class="form-control w-full" />

        <div class="mt-2 text-sm flex items-center justify-end gap-5">
            <button (click)="resendOTP()" [disabled]="resendDisabled"
                class="disabled:text-gray-500 text-white hover:text-indigo-600 cursor-pointer hover:underline text-lg">
                Resend OTP
            </button>
            <span *ngIf="resendDisabled" class="inline-block text-white text-lg">
                ({{ countdown }}s)
            </span>
        </div>
    </div>

    <div class="form-group">
        <button (click)="!showOTPBox ? handlePin() : handleOTP()" class="cursor-pointer relative inline-flex items-center justify-center p-0.5 mb-2 overflow-hidden text-sm font-medium text-gray-900 rounded-lg group 
             bg-gradient-to-br from-indigo-600 to-indigo-500 
             group-hover:from-indigo-600 group-hover:to-indigo-500 
             hover:text-white focus:ring-4 focus:outline-none focus:ring-indigo-300 dark:focus:ring-indigo-800">
            <span
                class="relative px-5 py-2.5 transition-all ease-in duration-75 bg-white rounded-md group-hover:bg-transparent">
                {{showOTPBox ? 'Verify' : 'Login'}}
            </span>
        </button>
    </div>
</div>

<div class="loader-overlay fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" *ngIf="loader">
    <img src="../assets/gif_logo.gif" alt="Loading..." class="loader-image w-24 h-24" />
</div>
