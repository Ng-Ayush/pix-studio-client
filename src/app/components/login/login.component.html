<div class="login-container animated-bg">
    <div class="logo">
        <div class="logo-icon">
            <img src="../../../assets/gif_logo.gif" alt="" width="100" height="100" class="object-cover">
        </div>
        Welcome to MY STUDIO
    </div>
    <div class="form-group">
        <label for="pin" class="form-label mb-2 block">Please enter your pin</label>
        <input type="text" autocomplete="off" (keyup.enter)="handlePin()" [(ngModel)]="loginPin" class="form-control"
            id="pin" placeholder="xxx-xxx">
    </div>
    <div class="form-group" *ngIf="showOTPBox">
        <label for="otp" class="form-label mb-2 block">OTP from SMS</label>
        <input type="text" autocomplete="off" class="form-control" id="otp" (input)="checkOtpMaxLength($event)"
            [(ngModel)]="otp" (keyup.enter)="handleOTP()" placeholder="xxx-xxx">
        <div class="mt-2 text-sm flex items-center justify-end gap-5 ">
            <button [disabled]="resendDisabled" (click)="resendOTP()"
                class="disabled:text-gray-500 text-white hover:text-indigo-600 cursor-pointer hover:underline text-lg">
                Resend OTP
            </button>
            <span *ngIf="resendDisabled" class="inline-block text-white text-lg"> ({{ countdown }}s)</span>
        </div>
    </div>
</div>

<div class="loader-overlay" *ngIf="loader">
    <img src="../assets/gif_logo.gif" alt="Loading..." class="loader-image" />
</div>
