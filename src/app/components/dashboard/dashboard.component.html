    <main class="main-content">
        <div class="border-l border-white bg-[#5758b2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7">
                    <div class="logo-img">
                        <img src="../../../assets/logo.png" alt=""
                            class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, Suraj Production</h2>
                        <small class="text-white">Tagline</small>
                    </div>
                </div>
            </div>
            <div class="w-full flex justify-around items-center border-t border-white p-[10px] ">
                <div class="flex gap-5">
                    <h3 class="text-white border pt-[5px] pb-[5px] pr-[20px] pl-[20px] rounded-md text-sm">Date :
                        {{todayDate|date : 'dd-MM-yyyy'}}</h3>
                    <h3 class="text-white border pt-[5px] pb-[5px] pr-[20px] pl-[20px] rounded-md text-sm">Time -
                        {{todayDate|date : 'h:mm:ss a'}} </h3>
                </div>
                <input type="text" placeholder="Search..." class="text-white border rounded-md py-2 px-3 text-sm">
            </div>
        </div>
