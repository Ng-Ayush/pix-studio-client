        <div class="border-l border-white bg-[#5758b2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7 items-center items-center">
                    <div class="logo-img">
                        <img [src]="userData?.studio_icon" alt="" class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, {{userData?.studio_name}}</h2>
                        <!-- <small class="text-white">Tagline</small> -->
                    </div>
                </div>
            </div>
        </div>

        <div class="p-8">
            <div class="grid gap-4 mb-4 md:grid-cols-3 sm:grid-cols-1 lg:grid-cols-4">
                <a class="dashboard-item" [routerLink]="['/billing']">

                </div>

                <a class="dashboard-item" [routerLink]="['/photo-sharing']">

                <div class="dashboard-item carousel relative w-full max-w-lg mx-auto overflow-hidden rounded-lg">
                    <div id="carousel" class="flex transition-transform duration-700" style="transform: translateX(0%)">
                        <ng-container *ngFor="let img of dynamicImages">
                            <img [src]="img"
                                class="flex-shrink-0 h-full w-full flex-shrink-0 object-cover" alt="Loading.." />
                        </ng-container>
                    </div>
                </div>

                <div class="dashboard-item invoice">
                    <h3 class="dashboard-item-title mb-2">Sales</h3>
                    <apx-chart [series]="salesSeries" *ngIf="salesSeries" [chart]="chartOptions"
                        [xaxis]="xAxis"></apx-chart>
                </div>

                <div class="dashboard-item invoice">
                    <h3 class="dashboard-item-title mb-2">Pending</h3>
                    <apx-chart *ngIf="estimateSeries" [series]="estimateSeries" [chart]="chartOptions"
                        [xaxis]="xAxis"></apx-chart>
                    <!-- <a class="dashboard-item-title " [routerLink]="['/bill-estimate']"></a> -->
                </div>
                <select id="granularity" [(ngModel)]="granularity" (change)="loadDashboardStats()"
                    class="border border-[#5758b2] px-2 py-1 rounded absolute right-0">

                            stroke="currentColor" class="size-6">

                        </svg>

                    </div>
                    <h3 class="dashboard-item-title text-2xl">Callings</h3>
                </div>

                <div class="dashboard-item" routerLink="/manage-profile">
                    <h3 class="dashboard-item-title mb-4 text-center text-2xl">My Accounts</h3>
                    <div class="my-accounts-icons flex gap-10 mt-[20px]">
                        <a href="javascript:void(0);" class="hover:bg-indigo-200">

<div *ngIf="showLogOutModal"
    class="fixed inset-0 bg-[#000000a3] opacity-100 flex items-center justify-center z-90 transition-opacity duration-300 ease-in-out">
    <div #modalContent
        class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform transition-all duration-300 ease-in-out"
        [ngClass]="{'modal-fade-in': showLogOutModal}">
        <div class="p-6 flex flex-col items-center">
            <div class="w-full max-w-[200px] mb-4">
                <img src="../../../assets/logout.png" alt="Delete illustration" class="w-full h-auto" />
            </div>

            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
                Are you sure you want to logout?
            </h2>
        </div>

        <div class="bg-gray-50 p-4 flex justify-center gap-5 rounded-b-lg">
            <button (click)="toggleLogoutModal()"
                class="cursor-pointer px-8 py-2 rounded-full bg-white text-gray-700 font-medium border border-gray-300 hover:bg-gray-100 transition-colors duration-200">
                Cancel
            </button>
            <button (click)="logout()"
                class="cursor-pointer px-8 py-2 rounded-full bg-red-600 text-white font-medium hover:bg-red-700 transition-colors duration-200">
                Logout
            </button>
        </div>
    </div>
</div>
