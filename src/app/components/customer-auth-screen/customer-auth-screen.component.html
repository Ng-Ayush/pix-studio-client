<div class="login-container">
    <div class="logo">
        <div class="logo-icon">
            <img src="../../../assets/logo.png" alt="" width="80" height="80">
        </div>
        Welcome to MY STUDIO
    </div>
    <div class="form-group">
        <label for="pin" class="form-label mb-2 block">Please enter your 7 digit unique code</label>
        <input type="text" autocomplete="off" maxlength="7" inputmode="numeric"  (input)="checkMaxLength($event)" (keyup.enter)="verifyCode()" [(ngModel)]="uniqueCode" class="form-control" id="pin" placeholder="xxx-xxx">
    </div>
</div>
