  <main class="main-content relative">
    <div class="border-l border-white bg-[#494CA2]">
      <div class="p-5 ps-10">
        <div class="heading flex gap-7 items-center">
          <div class="logo-img">
            <img [src]="userData.studio_icon" alt="" class="border radius-md text-white w-[50px] h-[50px]">
          </div>
          <div class="header-title">
            <h2 class="text-white">Hello, {{userData.studio_name}}</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="min-h-screen bg-gray-50">
      <!-- Header -->
      <div class="p-4 bg-white">
        <div class="flex items-center">
          <button class="cursor-pointer text-indigo-600 p-2 rounded-full hover:bg-gray-100" (click)="backToEvents()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
          </button>
        </div>

        <div class="mt-2 flex justify-between items-center">
          <div>
            <h1 class="text-2xl font-bold px-4 dark:bg-transparent">{{customerName|titlecase}} / {{eventName|titlecase}}
              / {{folderName|titlecase}}</h1>
            <p class="text-sm text-gray-500 px-4">{{ photos.length }} photos</p>
          </div>

          <button (click)="file.click()" *ngIf="!isEventSubmitted"
            class="bg-[#494CA2] text-white text-sm px-4 py-2 rounded-full flex items-center gap-3 hover:bg-[#494CA2] transition-colors cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Upload Photos</span>
            <input type="file" #file hidden accept="image/*" multiple (change)="handleFileInput($event)">
          </button>
          <button (click)="getSubmittedSelectedPhotos()" *ngIf="isEventSubmitted"
            class="bg-gray-200 text-indigo-600 px-4 text-sm py-2 rounded-full flex items-center gap-3 hover:bg-gray-300 transition-colors cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span>Get Selected Photos</span>
          </button>
        </div>

        <div class="mt-2">
          <div class="bg-gray-50 min-h-auto p-4">
            <!-- Header with selection controls -->
            <div class="flex justify-between items-center mb-4">
              <div class="flex items-center">
                <button (click)="toggleSelectAll()"
                  class="cursor-pointer flex items-center text-gray-700 hover:text-gray-900">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
                  </svg>
                  Select all
                </button>
              </div>

              <div class="flex gap-3">
                <button *ngIf="!imageSelected" (click)="setFilter('all')"
                  class="px-4 py-2 rounded-full text-sm font-medium cursor-pointer"
                  [ngClass]="filterMode === 'all' ? 'bg-[#494CA2] text-white' : 'bg-white text-gray-700 border border-gray-300'">
                  All
                </button>
                <button *ngIf="!imageSelected" (click)="setFilter('completed')"
                  class="px-4 py-2 rounded-full text-sm font-medium cursor-pointer"
                  [ngClass]="filterMode === 'completed' ? 'bg-white text-gray-700 border border-gray-300' : 'bg-white text-gray-700 border border-gray-300'">
                  Completed
                </button>
                <button *ngIf="imageSelected" (click)="toggleDeleteModal()"
                  class="px-4 flex py-2 rounded-full text-sm font-medium bg-red-600 text-white cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-trash-2 text-white-500 cursor-pointer">
                    <path d="M3 6h18" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <line x1="10" x2="10" y1="11" y2="17" />
                    <line x1="14" x2="14" y1="11" y2="17" />
                  </svg>
                  Delete
                </button>
              </div>
            </div>

            <!-- Photo grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
              <div *ngFor="let photo of filteredPhotos;trackBy:trackPhotos"
                class="bg-white rounded-lg shadow overflow-hidden">
                <div class="relative flex flex-col cursor-pointer z-10 px-2 pb-2 pt-6 group">
                  <div class="flex items-center justify-center h-56 sm:h-44 w-auto m-auto">
                    <img [ngSrc]="photo.photo_url" [alt]="photo.photo_name" width="100" height="150"
                      class="object-contain w-full h-full rounded" priority />
                  </div>
                  <button (click)="toggleSingleDeleteModal(photo)"
                    class="px-2 absolute top-2 right-2 py-2 rounded-full text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 font-medium bg-red-700 text-white cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="lucide lucide-trash-2 text-white-500 cursor-pointer">
                      <path d="M3 6h18" />
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                      <line x1="10" x2="10" y1="11" y2="17" />
                      <line x1="14" x2="14" y1="11" y2="17" />
                    </svg>
                  </button>
                </div>
                <div class="p-2">
                  <div class="flex flex-row text-md items-center font-medium justify-between">
                    <div class="flex items-center gap-3 px-2">
                      <input type="checkbox" [id]="photo.photo_id" [(ngModel)]="photo.selected"
                        (change)="updateSelectAllState()"
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded cursor-pointer" />
                      <label style="width:140px;" [for]="photo.photo_id" class="truncate text-sm text-gray-700">{{
                        photo.photo_name
                        }}</label>
                    </div>
                    <div *ngIf="photo.is_selected">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                        class="size-6 text-green-500">
                        <path fill-rule="evenodd"
                          d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                          clip-rule="evenodd" />
                      </svg>

                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div *ngIf="deleteModal"
              class="fixed inset-0 bg-[#000000a3] flex items-center justify-center z-90 transition-opacity duration-300 ease-in-out">
              <div #modalContent
                class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform transition-all duration-300 ease-in-out"
                [ngClass]="{'modal-fade-in': deleteModal}">
                <div class="p-6 flex flex-col items-center">
                  <div class="w-full max-w-[200px] mb-4">
                    <img src="../../../assets/delete-img.svg" alt="Delete illustration" class="w-full h-auto" />
                  </div>

                  <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
                    Are you sure you want to delete?
                  </h2>

                </div>

                <div class="bg-gray-50 p-4 flex justify-center items-center gap-5 rounded-b-lg">
                  <button (click)="closeModal()" [disabled]="isLoading"
                    class="cursor-pointer px-8 py-2 rounded-full bg-white text-gray-700 font-medium border border-gray-300 hover:bg-gray-100 transition-colors duration-200">
                    Cancel
                  </button>
                  <button (click)="deletePhotos()" [disabled]="isLoading"
                    class="cursor-pointer disabled:bg-red-400 px-8 py-2 rounded-full bg-red-600 text-white font-medium hover:bg-red-700 transition-colors duration-200">
                    Delete
                  </button>
                  <ng-container *ngIf="isLoading">
                    <div role="status">
                      <svg aria-hidden="true"
                        class="w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600"
                        viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                          d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                          fill="currentColor" />
                        <path
                          d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                          fill="currentFill" />
                      </svg>
                      <span class="sr-only">Loading...</span>
                    </div>
                  </ng-container>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="sortImagesModal" class="fixed inset-0 flex items-center justify-center bg-[#000000a3] opacity-100 z-50">
      <div class="bg-white rounded-2xl shadow-xl w-[420px] p-6 gap-4">
        <!-- Title -->
        <h2 class="text-lg font-semibold text-gray-800">Get Selected Photos</h2>

        <!-- Folder Box -->
        <div class="bg-gray-100 rounded-xl p-4 flex items-center justify-between">
          <div class="flex flex-col">
            <div class="flex items-center gap-4">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
              </svg>
              <span class="font-semibold text-gray-800">{{folderName|titlecase}}</span>
            </div>
            <div class="small font-xs text-gray-400" *ngIf="originalDirectoryName">'{{originalDirectoryName}}'</div>
          </div>
          <button class="bg-gray-200 py-2 px-5 text-sm hover:bg-gray-300 rounded-full cursor-pointer"
            (click)="sortImages()">Sort Now</button>
        </div>

        <!-- Action Button -->
        <div class="flex items-center justify-between">
          <button (click)="selectFolder()"
            class="cursor-pointer bg-green-600 text-white font-semibold py-2 px-4 rounded-full hover:bg-green-700 transition">
            Select original folder
          </button>
          <button (click)="closeModal()"
            class="cursor-pointer text-gray-600 bg-gray-100 px-4 py-2 rounded-full hover:bg-gray-200 transition">
            Cancel
          </button>
        </div>
      </div>
    </div>

  </main>
</div>

<div *ngIf="showLogOutModal"
  class="fixed inset-0 bg-[#000000a3] opacity-100 flex items-center justify-center z-90 transition-opacity duration-300 ease-in-out">
  <div #modalContent
    class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 transform transition-all duration-300 ease-in-out"
    [ngClass]="{'modal-fade-in': showLogOutModal}">
    <div class="p-6 flex flex-col items-center">
      <div class="w-full max-w-[200px] mb-4">
        <img src="../../../assets/logout.png" alt="Delete illustration" class="w-full h-auto" />
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
        Are you sure you want to logout?
      </h2>
    </div>

    <div class="bg-gray-50 p-4 flex justify-center gap-5 rounded-b-lg">
      <button (click)="toggleLogoutModal()"
        class="cursor-pointer px-8 py-2 rounded-full bg-white text-gray-700 font-medium border border-gray-300 hover:bg-gray-100 transition-colors duration-200">
        Cancel
      </button>
      <button (click)="logout()"
        class="cursor-pointer px-8 py-2 rounded-full bg-red-600 text-white font-medium hover:bg-red-700 transition-colors duration-200">
        Logout
      </button>
    </div>
  </div>
</div>
