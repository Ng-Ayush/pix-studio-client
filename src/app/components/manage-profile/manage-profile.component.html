                        <h2 class="text-white">Hello, Suraj Production</h2>

            </div>
            <div class="w-full flex justify-around items-center border-t border-white p-[10px] ">

                <input type="text" placeholder="Search..." class="text-white border rounded-md py-2 px-3 text-sm">
            </div>
        </div>

                <div class="min-h-min   flex items-center justify-center">
                    <div class="bg-white rounded-lg p-8 w-full">
                       <div class="text-center mb-8">
                            <h2 class="text-2xl font-bold text-gray-800"> Update Profile</h2>
                        </div>

                        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-6 ">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full
                                        Name</label>
                                    <input type="text" id="name" formControlName="name"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your full name"
                                        [class.border-red-500]="userForm.get('name')?.invalid && userForm.get('name')?.touched">
                                    <div *ngIf="userForm.get('name')?.invalid && userForm.get('name')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Name is required
                                    </div>
                                </div>
                                
                                <div>
                                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email
                                        Address</label>
                                    <input type="email" id="email" formControlName="email"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your email"
                                        [class.border-red-500]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
                                    <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        <span *ngIf="userForm.get('email')?.errors?.['required']">Email is
                                            required</span>
                                        <span *ngIf="userForm.get('email')?.errors?.['email']">Please enter a valid
                                            email</span>
                                    </div>
                                </div>

                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone
                                        Number</label>
                                    <input type="tel" id="phone" formControlName="phone_number"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your phone number"
                                        [class.border-red-500]="userForm.get('phone_number')?.invalid && userForm.get('phone_number')?.touched">
                                    <div *ngIf="userForm.get('phone_number')?.invalid && userForm.get('phone_number')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Phone number is required
                                    </div>
                                </div>
                             
                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Address</label>
                                    <input type="text" id="name" formControlName="address"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your full name"
                                        [class.border-red-500]="userForm.get('address')?.invalid && userForm.get('address')?.touched">
                                    <div *ngIf="userForm.get('address')?.invalid && userForm.get('address')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Address is required
                                    </div>
                                </div>
                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Terms and Conditons</label>
                                    <input type="text" id="name" formControlName="terms_and_condition"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your full name"
                                        [class.border-red-500]="userForm.get('terms_and_condition')?.invalid && userForm.get('terms_and_condition')?.touched">
                                    <div *ngIf="userForm.get('terms_and_condition')?.invalid && userForm.get('terms_and_condition')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        TnC is required
                                    </div>
                                </div>
                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Studio Icon</label>
                                    <input type="file" id="name" accept="image/*" (change)="onImgUpload($event)"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Studio icon"
                                        [class.border-red-500]="userForm.get('studio_icon')?.invalid && userForm.get('studio_icon')?.touched">
                                    <div *ngIf="userForm.get('studio_icon')?.invalid && userForm.get('studio_icon')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Studio icon is required
                                    </div>
                                </div> 
                                <div *ngIf="userForm.value.studio_icon">
                                    Preview Studio Icon
                                    <img class="h-48 w-96 object-cover ..." [src]="userForm.value.studio_icon" />
                                </div>
                            </div>
                                <button type="submit" [disabled]="userForm.invalid || isSubmitting"
                                    class="mt-5 cursor-pointer bg-purple-600 hover:bg-purple-700 disabled:bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                                    <svg *ngIf="isSubmitting" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white"
                                        fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                            stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor"
                                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                        </path>
                                    </svg>
                                    {{ currentUserId ? "Update User" : 'Create User' }}
                                </button>
                        </form>

                    </div>
                </div>
            </div>
