    <main class="main-content">
        <div class="border-l border-white bg-[#494CA2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7 items-center">
                    <div class="logo-img">
                        <img src="../../../assets/logo.png" alt=""
                            class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, Suraj Production</h2>
                        <!-- <small class="text-white">Tagline</small> -->
                    </div>
                </div>
            </div>
            <div class="back-btn flex justify-between items-center py-3 px-10 bg-gray-200">
                <a class="flex items-center cursor-pointer" [routerLink]="['/admin/manage-features']">
                    <button
                        class="cursor-pointer rounded p-2 hover:bg-[#494CA2] hover:text-white transition-colors duration-200 inline-flex items-center gap-2 justify-center"><svg
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="h-4 w-4">
                            <path
                                d="M8.83 6a30.23 30.23 0 0 0-5.62 5.406A.949.949 0 0 0 3 12m5.83 6a30.233 30.233 0 0 1-5.62-5.406A.949.949 0 0 1 3 12m0 0h18">
                            </path>
                        </svg> Go back</button>
                </a>
                <a href="javascript:void(0);" [routerLink]="['/admin/manage-categories']"
                    class="text-[#494CA2] hover:text-black hover:underline transition-all duration-200">
                    View Categories
                </a>
            </div>
        </div>

        <main class="min-h-screen bg-gray-50">
            <div>
                <div class="min-h-min   flex items-center justify-center">
                    <div class="bg-white rounded-lg p-8 w-full">
                        <div class="mb-8">
                            <h2 class="text-2xl font-bold text-gray-800">{{itemId ? 'Update Feature' : "Create Feature"}}</h2>
                        </div>

                        <form [formGroup]="featureForm" (ngSubmit)="onSubmit()" class="">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                                        Title</label>
                                    <input type="text" id="title" formControlName="title" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter Title"
                                        [class.border-red-500]="featureForm.get('title')?.invalid && featureForm.get('title')?.touched">
                                    <div *ngIf="featureForm.get('title')?.invalid && featureForm.get('title')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Title is required
                                    </div>
                                </div>

                                <div>
                                    <label for="category"
                                        class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                                    <select id="category" formControlName="category"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200">
                                        <option value="">Select a category</option>
                                        <option *ngFor="let cat of categoryNames" [value]="cat.category_id">
                                            {{cat.category_name }}</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="youtube_thumbnail" class="block flex gap-2 items-center text-sm font-medium text-gray-700 mb-2">
                                        Youtube Thumbnail
                                        <span role="status" *ngIf="thumbnailLoader">
                                            <svg aria-hidden="true" class="w-8 h-8 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600"
                                                viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                                                    fill="currentColor" />
                                                <path
                                                    d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                                                    fill="currentFill" />
                                            </svg>
                                            <span class="sr-only">Loading...</span>
                                        </span>
                                    </label>
                                    <input type="file" id="name" (change)="handleFileUpload($event)" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        [class.border-red-500]="featureForm.get('youtube_thumbnail')?.invalid && featureForm.get('youtube_thumbnail')?.touched">
                                    <div *ngIf="featureForm.get('youtube_thumbnail')?.invalid && featureForm.get('youtube_thumbnail')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Youtube Thumbnail is required
                                    </div>
                                 
                                </div>

                                <div *ngIf="featureForm.get('youtube_thumbnail')?.value" class="flex items-center gap-2">
                                    <img [src]="featureForm.get('youtube_thumbnail')?.value" alt="Loading...."
                                        class="w-32 h-32 object-cover rounded-lg">
                                </div>

                            </div>
                            <div class="grid grid-cols-1 gap-4 my-2">

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Youtube Url</label>
                                    <input type="url" id="name" formControlName="youtube_url" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Youtube Url"
                                        [class.border-red-500]="featureForm.get('youtube_url')?.invalid && featureForm.get('youtube_url')?.touched">
                                    <div *ngIf="featureForm.get('youtube_url')?.invalid && featureForm.get('youtube_url')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Youtube url is required
                                    </div>
                                </div>

                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                                        Price</label>
                                    <input type="tel" id="phone" formControlName="price" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Price"
                                        [class.border-red-500]="featureForm.get('price')?.invalid && featureForm.get('price')?.touched"
                                        maxlength="5">
                                    <div *ngIf="featureForm.get('price')?.invalid && featureForm.get('price')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Price is required
                                    </div>
                                </div>


                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Drive Url</label>
                                    <input type="url" id="name" formControlName="drive_url" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Drive Url"
                                        [class.border-red-500]="featureForm.get('drive_url')?.invalid && featureForm.get('drive_url')?.touched">
                                    <div *ngIf="featureForm.get('drive_url')?.invalid && featureForm.get('drive_url')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Drive url is required
                                    </div>
                                </div>

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Description</label>
                                    <textarea type="text" id="name" formControlName="description" rows="5"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter description"
                                        [class.border-red-500]="featureForm.get('description')?.invalid && featureForm.get('description')?.touched"></textarea>
                                    <div *ngIf="featureForm.get('description')?.invalid && featureForm.get('description')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Description is required
                                    </div>
                                </div>

                                <div class="flex items-center">
                                    <span class="status-pill flex items-center gap-2 ">
                                        <label class="switch">
                                            <input [checked]="featureForm.get('is_new_arrival')?.value" formControlName="is_new_arrival" type="checkbox">
                                            <div class="slider">
                                                <div class="circle">
                                                    <svg class="cross" xml:space="preserve" style="enable-background:new 0 0 512 512"
                                                        viewBox="0 0 365.696 365.696" y="0" x="0" height="6" width="6"
                                                        xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                        <g>
                                                            <path data-original="#000000" fill="currentColor"
                                                                d="M243.188 182.86 356.32 69.726c12.5-12.5 12.5-32.766 0-45.247L341.238 9.398c-12.504-12.503-32.77-12.503-45.25 0L182.86 122.528 69.727 9.374c-12.5-12.5-32.766-12.5-45.247 0L9.375 24.457c-12.5 12.504-12.5 32.77 0 45.25l113.152 113.152L9.398 295.99c-12.503 12.503-12.503 32.769 0 45.25L24.48 356.32c12.5 12.5 32.766 12.5 45.247 0l113.132-113.132L295.99 356.32c12.503 12.5 32.769 12.5 45.25 0l15.081-15.082c12.5-12.504 12.5-32.77 0-45.25zm0 0">
                                                            </path>
                                                        </g>
                                                    </svg>
                                                    <svg class="checkmark" xml:space="preserve" style="enable-background:new 0 0 512 512"
                                                        viewBox="0 0 24 24" y="0" x="0" height="10" width="10"
                                                        xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                        <g>
                                                            <path class="" data-original="#000000" fill="currentColor"
                                                                d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z">
                                                            </path>
                                                        </g>
                                                    </svg>
                                                </div>
                                            </div>
                                        </label>Is New Arrival ?
                                    </span>
                                </div>
                                <div class="flex items-center">
                                   <span class="status-pill flex items-center gap-2 ">
                                        <label class="switch">
                                            <input [checked]="featureForm.get('is_unique_feature')?.value" formControlName="is_unique_feature" type="checkbox">
                                            <div class="slider">
                                                <div class="circle">
                                                    <svg class="cross" xml:space="preserve" style="enable-background:new 0 0 512 512"
                                                        viewBox="0 0 365.696 365.696" y="0" x="0" height="6" width="6"
                                                        xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                        <g>
                                                            <path data-original="#000000" fill="currentColor"
                                                                d="M243.188 182.86 356.32 69.726c12.5-12.5 12.5-32.766 0-45.247L341.238 9.398c-12.504-12.503-32.77-12.503-45.25 0L182.86 122.528 69.727 9.374c-12.5-12.5-32.766-12.5-45.247 0L9.375 24.457c-12.5 12.504-12.5 32.77 0 45.25l113.152 113.152L9.398 295.99c-12.503 12.503-12.503 32.769 0 45.25L24.48 356.32c12.5 12.5 32.766 12.5 45.247 0l113.132-113.132L295.99 356.32c12.503 12.5 32.769 12.5 45.25 0l15.081-15.082c12.5-12.504 12.5-32.77 0-45.25zm0 0">
                                                            </path>
                                                        </g>
                                                    </svg>
                                                    <svg class="checkmark" xml:space="preserve" style="enable-background:new 0 0 512 512"
                                                        viewBox="0 0 24 24" y="0" x="0" height="10" width="10"
                                                        xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                        <g>
                                                            <path class="" data-original="#000000" fill="currentColor"
                                                                d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z">
                                                            </path>
                                                        </g>
                                                    </svg>
                                                </div>
                                            </div>
                                        </label>Is Unique or Limited Edition ?
                                    </span>
                                </div>

                            </div>

                        </form>
                        <button type="button" (click)="onSubmit()" [disabled]="featureForm.invalid || isSubmitting"
                            class="mt-5 flex items-center justify-center gap-2 cursor-pointer bg-[#494CA2] hover:bg-[#494CA2] disabled:bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                            <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                            {{ itemId ? "Update Features" : 'Create Features' }}
                        </button>
                    </div>
                </div>
            </div>
