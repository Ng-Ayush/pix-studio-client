    <main class="main-content">
        <div class="border-l border-white bg-[#5758b2]">
            <div class="p-5 ps-10">
                <div class="heading flex gap-7 items-center">
                    <div class="logo-img">
                        <img src="../../../assets/logo.png" alt=""
                            class="border radius-md text-white w-[50px] h-[50px]">
                    </div>
                    <div class="header-title">
                        <h2 class="text-white">Hello, Suraj Production</h2>
                        <!-- <small class="text-white">Tagline</small> -->
                    </div>
                </div>
            </div>
            <div class="back-btn flex justify-between items-center py-3 px-10 bg-gray-200">
                <a class="flex items-center cursor-pointer" [routerLink]="['/admin/manage-features']">
                    <button
                        class="cursor-pointer rounded p-2 hover:bg-[#5758b2] hover:text-white transition-colors duration-200 inline-flex items-center gap-2 justify-center"><svg
                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="h-4 w-4">
                            <path
                                d="M8.83 6a30.23 30.23 0 0 0-5.62 5.406A.949.949 0 0 0 3 12m5.83 6a30.233 30.233 0 0 1-5.62-5.406A.949.949 0 0 1 3 12m0 0h18">
                            </path>
                        </svg> Go back</button>
                </a>
                <a href="javascript:void(0);" [routerLink]="['/admin/manage-categories']" class="text-[#5758b2] hover:text-black hover:underline transition-all duration-200">
                    View Categories 
                </a>
            </div>
        </div>

        <main class="min-h-screen bg-gray-50">
            <div>
                <div class="min-h-min   flex items-center justify-center">
                    <div class="bg-white rounded-lg p-8 w-full">
                        <div class="mb-8">
                            <h2 class="text-2xl font-bold text-gray-800">{{itemId ? 'Update Feature' : "Create Feature"}}</h2>
                        </div>

                        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                                        Title</label>
                                    <input type="text" id="title" formControlName="title" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter Title"
                                        [class.border-red-500]="userForm.get('title')?.invalid && userForm.get('title')?.touched">
                                    <div *ngIf="userForm.get('title')?.invalid && userForm.get('title')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Title is required
                                    </div>
                                </div>

                                <div>
                                    <label for="category"
                                        class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                                    <select id="category" formControlName="category"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200">
                                        <option value="">Select a category</option>
                                        <option *ngFor="let cat of categoryNames" [value]="cat.category_id">
                                            {{cat.category_name }}</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                                        Price</label>
                                    <input type="tel" id="phone" formControlName="price" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Price"
                                        [class.border-red-500]="userForm.get('price')?.invalid && userForm.get('price')?.touched"
                                        maxlength="5">
                                    <div *ngIf="userForm.get('price')?.invalid && userForm.get('price')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Price is required
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 gap-4 my-2">

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Youtube Url</label>
                                    <input type="url" id="name" formControlName="youtube_url" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Youtube Url"
                                        [class.border-red-500]="userForm.get('youtube_url')?.invalid && userForm.get('youtube_url')?.touched">
                                    <div *ngIf="userForm.get('youtube_url')?.invalid && userForm.get('youtube_url')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Youtube url is required
                                    </div>
                                </div>

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Drive Url</label>
                                    <input type="url" id="name" formControlName="drive_url" autocomplete="off"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter your Drive Url"
                                        [class.border-red-500]="userForm.get('drive_url')?.invalid && userForm.get('drive_url')?.touched">
                                    <div *ngIf="userForm.get('drive_url')?.invalid && userForm.get('drive_url')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Drive url is required
                                    </div>
                                </div>

                                <div>
                                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                                        Description</label>
                                    <textarea type="text" id="name" formControlName="description" rows="5"
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition duration-200"
                                        placeholder="Enter description"
                                        [class.border-red-500]="userForm.get('description')?.invalid && userForm.get('description')?.touched"></textarea>
                                    <div *ngIf="userForm.get('description')?.invalid && userForm.get('description')?.touched"
                                        class="text-red-500 text-sm mt-1">
                                        Description is required
                                    </div>
                                </div>

                                <div class="flex items-center">
                                    <input id="link-checkbox" type="checkbox" formControlName="is_new_arrival"
                                        class="w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded-sm focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600">
                                    <label for="link-checkbox" class="ms-2 text-sm font-medium text-gray-900">Show On
                                        Landing Page? </label>
                                </div>

                            </div>

                        </form>
                        <button type="button" (click)="onSubmit()" [disabled]="userForm.invalid || isSubmitting"
                            class="mt-5 flex items-center justify-center gap-2 cursor-pointer bg-purple-600 hover:bg-purple-700 disabled:bg-gray-400 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                            <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5 text-white" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                            {{ itemId ? "Update Features" : 'Create Features' }}
                        </button>
                    </div>
                </div>
            </div>
