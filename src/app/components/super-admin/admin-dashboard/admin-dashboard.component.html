<div class="fixed inset-0 bg-[#000000a3] bg-opacity-100 flex flex-col justify-center items-center z-50  transition-opacity duration-300 ease-in-out"
    *ngIf="showModal">
    <div class="bg-white rounded-xl w-full max-w-5xl p-6 shadow-xl transform transition-all duration-300 ease-in-out"
        [ngClass]="{'modal-fade-in': showModal}">
        <h2 class="text-2xl font-semibold mb-6 flex items-center justify-between">Add Carousel Images
            <button class="close cursor-pointer" (click)="showModal=false">x</button>
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div *ngFor="let img of images; let i = index; trackBy: trackByIndex" loading="eager" (click)="triggerFileInput(i)"
                class="border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center h-48 cursor-pointer hover:border-blue-400 transition relative overflow-hidden bg-gray-50">

                <input type="file" accept=".jpg, .jpeg, image/jpeg" id="fileInput{{i}}" (change)="onFileSelected($event, i)"
                    class="hidden" />

                <ng-container *ngIf="img; else placeholder">
                    <img [src]="img" alt="Preview" class="w-full h-full object-cover rounded-lg" />
                </ng-container>

                <ng-template #placeholder>
                    <span class="text-gray-400">Click to Upload</span>
                </ng-template>
            </div>
            <div class="py-3"> <button class="px-4 py-2 rounded-xl bg-[#494CA2] text-white hover:bg-[#494CA2] cursor-pointer" (click)="uploadDynamicImages()">Save </button></div>
        </div>
    </div>
</div>
