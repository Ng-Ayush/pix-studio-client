<div class="bg-[#FFFFFF] min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <div class="bg-[#494CA2] w-full flex flex-col items-center pt-6 pb-8">
        <div class="flex items-center mb-2">
            <!-- Profile Icon Circle -->
            <div class="bg-white bg-opacity-30 rounded-full w-8 h-8 flex items-center justify-center mr-4">
                <!-- Place your profile SVG here, or use a default user icon character -->
                <img [src]="userData?.studio_icon" alt="">
            </div>
            <div>
                <div class="text-white font-bold text-xl sm:text-2xl tracking-wide">{{userData?.studio_name}}</div>
                <div class="text-white text-sm opacity-90">{{userData?.address}}</div>
            </div>
        </div>
    </div>

    <!-- Main Card Section -->
    <main class="flex-1 w-full flex flex-col items-center justify-center">
        <div *ngIf="!isBrowseAllFolder"
            class="w-full max-w-md min-h-auto bg-white rounded-2xl shadow-xl mb-4 px-2 pt-20 pb-20 flex flex-col items-center">
            <!-- Title -->
            <div
                class="text-[#494CA2] text-center mb-8 font-[cursive] text-lg sm:text-xl font-semibold tracking-wide uppercase">
                Welcome to My Studio AI Feature
            </div>

            <!-- Feature 1 -->
            <div class="flex flex-col items-center w-full mb-10">
                <!-- Colored Icon Box -->
                <div
                    class="bg-[#494CA2] cursor-pointer rounded-[20px] w-28 h-28 sm:w-32 sm:h-32 flex items-center justify-center mb-2 hover:bg-[#494CA2]">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="text-white size-24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
                    </svg>

                </div>
                <div
                    class="text-[#494CA2] font-semibold text-base sm:text-lg tracking-wide font-[Arial] mt-1 text-center">
                    AI DOWNLOAD
                </div>
            </div>
            <!-- Feature 2 -->
            <div class="flex flex-col items-center w-full">
                <!-- Colored Icon Box -->
                <div (click)="onBrowseAllFolder()"
                    class="bg-[#494CA2] cursor-pointer hover:bg-[#494CA2] rounded-[20px] w-28 h-28 sm:w-32 sm:h-32 flex items-center justify-center mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="text-white size-24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>

                </div>
                <div
                    class="text-[#494CA2] font-semibold text-base sm:text-lg tracking-wide font-[Arial] mt-1 text-center">
                    BROWSE ALL FOLDERS
                </div>
            </div>
        </div>
        <ng-container *ngIf="isBrowseAllFolder">
            <div class="flex justify-between gap-3 w-full mb-3 sticky top-0 z-100 bg-gray-200 p-2">
                <div>
                    <a class="flex items-center cursor-pointer" (click)="goBack()">
                        <button
                            class="cursor-pointer rounded p-2 hover:bg-[#494CA2] hover:text-white transition-colors duration-200 inline-flex items-center gap-2 justify-center"><svg
                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="h-4 w-4">
                                <path
                                    d="M8.83 6a30.23 30.23 0 0 0-5.62 5.406A.949.949 0 0 0 3 12m5.83 6a30.233 30.233 0 0 1-5.62-5.406A.949.949 0 0 1 3 12m0 0h18">
                                </path>
                            </svg> Go back</button>
                    </a>
                </div>
                <div class="flex gap-2">
                    <button (click)="toggleSelectAll()"
                        class="px-4 py-2 rounded-full text-sm font-medium cursor-pointer bg-[#494CA2] text-white">
                        {{isAllSelected ? 'Deselect All' : 'Select All'}}
                    </button>
                    <button *ngIf="imageSelected" (click)="downloadPhoto()"
                        class="px-4 py-2 rounded-full text-sm font-medium cursor-pointer bg-[#494CA2] text-white">
                        Download
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 w-full sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 my-5 px-5">
                <div *ngFor="let photo of photos;trackBy:trackPhotos"
                    class="bg-white rounded-lg shadow-lg overflow-hidden">
                    <div class="relative flex flex-col cursor-pointer z-10 px-2 pb-2 pt-6 group"
                        (click)="togglePhoto(photo)">
                        <div class="flex items-center justify-center h-56 sm:h-44 w-auto m-auto">
                            <img [ngSrc]="photo.photo_url" [alt]="photo.photo_name" width="100" height="150"
                                class="object-contain w-full h-full rounded" priority />
                        </div>
                    </div>
                    <div class="p-2">
                        <div class="flex flex-row text-md items-center font-medium justify-center">
                            <div class="flex items-center gap-3 px-2">
                                <input type="checkbox" [id]="photo.photo_id" [(ngModel)]="photo.selected"
                                    (change)="togglePhoto(photo)"
                                    class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded cursor-pointer" />
                                <label style="width:140px;" [for]="photo.photo_id"
                                    class="truncate text-sm text-gray-700">{{ photo.photo_name
                                    }}</label>
                            </div>
                            <div *ngIf="photo.is_selected">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    class="size-6 text-green-500">
                                    <path fill-rule="evenodd"
                                        d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
                                        clip-rule="evenodd" />
                                </svg>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </main>

    <footer class="bg-[#494CA2] w-full pt-4 pb-3 px-2 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <a [href]="userData?.facebook_url" target="_blank"
                class="text-[#3D8BFF] bg-white rounded-full w-7 h-7 flex items-center justify-center">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M19.616 3H4.384C3.075 3 2 4.075 2 5.384v13.232C2 19.925 3.075 21 4.384 21h8.475v-7.104H10.37V11.14h2.489v-1.464c0-2.458 1.502-3.799 3.696-3.799 1.08 0 2.214.195 2.214.195v2.436h-1.248c-1.229 0-1.614.763-1.614 1.545V11.14h2.749l-.44 2.756h-2.309v7.104h4.532C20.925 21 22 19.925 22 18.616V5.384A2.386 2.386 0 0 0 19.616 3" />
                </svg>
            </a>
            <a [href]="userData?.instagram_url" target="_blank"
                class="text-[#E4405F] bg-white rounded-full w-7 h-7 flex items-center justify-center">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M7.75 2h8.5A5.25 5.25 0 0 1 21.5 7.25v9.5A5.25 5.25 0 0 1 16.25 22h-8.5A5.25 5.25 0 0 1 2.5 16.75v-9.5A5.25 5.25 0 0 1 7.75 2Zm0 1.5A3.75 3.75 0 0 0 4 7.25v9.5A3.75 3.75 0 0 0 7.75 20.5h8.5A3.75 3.75 0 0 0 20 16.75v-9.5A3.75 3.75 0 0 0 16.25 3.5h-8.5ZM12 7.75a4.25 4.25 0 1 1 0 8.5 4.25 4.25 0 0 1 0-8.5Zm0 1.5a2.75 2.75 0 1 0 0 5.5 2.75 2.75 0 0 0 0-5.5Zm6-1.25a.75.75 0 1 1 0 1.5 .75.75 0 0 1 0-1.5Z" />
                </svg>
            </a>
            <a [href]="userData?.youtube_url" target="_blank"
                class="text-[#FF0000] bg-white rounded-full w-7 h-7 flex items-center justify-center">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M21.8 8s-.2-1.5-.81-2.18C20.2 5.2 19.4 5.18 19 5.12 16.43 5 12 5 12 5s-4.43 0-7 .12c-.4.06-1.2.08-1.99.7C2.21 6.5 2 8 2 8S1.86 9.54 1.86 11.08v1.84c0 1.54.14 3.1.14 3.1s.2 1.5.81 2.19c.79.65 1.81.62 2.27.69C7.57 19 12 19 12 19s4.43 0 7-.12c.4-.06 1.2-.08 2-.7.61-.7.8-2.19.8-2.19s.14-1.56.14-3.1v-1.84C22 9.54 21.8 8 21.8 8Zm-12 6V9l5.5 2.99-5.5 3.01Z" />
                </svg>
            </a>
        </div>
        <div class="flex items-center text-white gap-2">
            <div class=" bg-opacity-20 rounded-full w-7 h-7 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
                </svg>

            </div>
            <span class="text-white font-semibold text-sm tracking-wide">{{userData?.phone_number}}</span>
        </div>
    </footer>
</div>
