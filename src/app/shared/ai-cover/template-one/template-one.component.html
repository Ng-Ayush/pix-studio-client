<div class="gallery-container">
    <!-- Header -->
    <header class="header" [class.scrolled]="isHeaderScrolled">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 9a3.75 3.75 0 100 7.5A3.75 3.75 0 0012 9z" />
                        <path fill-rule="evenodd"
                            d="M9.344 3.071a49.52 49.52 0 015.312 0c.967.052 1.83.585 2.332 1.39l.821 1.317c.24.383.645.643 1.11.71.386.054.77.113 1.152.177 1.432.239 2.429 1.493 2.429 2.909V18a3 3 0 01-3 3h-15a3 3 0 01-3-3V9.574c0-1.416.997-2.67 2.429-2.909.382-.064.766-.123 1.151-.178a1.56 1.56 0 001.11-.71l.822-1.315a2.942 2.942 0 012.332-1.39zM6.75 12.75a5.25 5.25 0 1110.5 0 5.25 5.25 0 01-10.5 0zm12-1.5a.75.75 0 100-1.5.75.75 0 000 1.5z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="brand-info">
                    <h1 class="brand-name">Suraj Production</h1>
                    <p class="brand-location">Raebareli, India</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Carousel Section -->
    <div class="carousel-wrapper">
        <div class="carousel">
            <div class="carousel-inner" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
                <div class="carousel-item" *ngFor="let image of carouselImages">
                    <img [src]="image" alt="Carousel Image" />
                </div>
            </div>

            <button class="carousel-btn prev" (click)="prevSlide()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <button class="carousel-btn next" (click)="nextSlide()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>

            <div class="carousel-indicators">
                <button *ngFor="let image of carouselImages; let i = index" [class.active]="currentSlide === i"
                    (click)="goToSlide(i)">
                </button>
            </div>
        </div>
    </div>

    <!-- Tabs Section -->
    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn" [class.active]="activeTab === 'all'" (click)="filterImages('all')">
                Browse All Photos
            </button>
            <button class="tab-btn" [class.active]="activeTab === 'photos'" (click)="filterImages('photos')">
                Photos
            </button>
            <button class="tab-btn" [class.active]="activeTab === 'matched'" (click)="filterImages('matched')">
                Matched Photos
            </button>
            <button class="tab-btn" [class.active]="activeTab === 'mehdi'" (click)="filterImages('mehdi')">
                Mehndi
            </button>
            <button class="tab-btn" [class.active]="activeTab === 'haldi'" (click)="filterImages('haldi')">
                Haldi
            </button>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid">
        <div class="gallery-item" *ngFor="let image of filteredImages; let i = index"
            [style.animation-delay]="i * 0.05 + 's'">
            <img [src]="image.url" [alt]="image.title" />
            <div class="overlay">
                <button class="action-btn view-btn" (click)="openModal(image)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    View
                </button>
                <button class="action-btn download-btn" (click)="downloadImage(image.url, image.title)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Download
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-top">
                <div class="footer-logo-section">
                    <div class="footer-logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 9a3.75 3.75 0 100 7.5A3.75 3.75 0 0012 9z" />
                            <path fill-rule="evenodd"
                                d="M9.344 3.071a49.52 49.52 0 015.312 0c.967.052 1.83.585 2.332 1.39l.821 1.317c.24.383.645.643 1.11.71.386.054.77.113 1.152.177 1.432.239 2.429 1.493 2.429 2.909V18a3 3 0 01-3 3h-15a3 3 0 01-3-3V9.574c0-1.416.997-2.67 2.429-2.909.382-.064.766-.123 1.151-.178a1.56 1.56 0 001.11-.71l.822-1.315a2.942 2.942 0 012.332-1.39zM6.75 12.75a5.25 5.25 0 1110.5 0 5.25 5.25 0 01-10.5 0zm12-1.5a.75.75 0 100-1.5.75.75 0 000 1.5z"
                                clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="footer-brand-info">
                        <h2 class="footer-brand-name">Suraj Production</h2>
                        <p class="footer-brand-location">Raebareli, India</p>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; {{ currentYear }} Suraj Production. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div class="modal" *ngIf="isModalOpen" (click)="closeModal()">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <button class="modal-close" (click)="closeModal()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <button class="modal-nav prev" (click)="prevImage()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <div class="modal-image-wrapper">
                <img [src]="currentImage?.url" [alt]="currentImage?.title" class="modal-image" />
                <div class="modal-title">{{ currentImage?.title }}</div>
            </div>

            <button class="modal-nav next" (click)="nextImage()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>
</div>
