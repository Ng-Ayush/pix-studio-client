<div class="min-h-screen bg-gray-950 text-white flex flex-col items-center px-4 py-8">
      <!-- Header -->
      <header class="w-full max-w-4xl flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">📸 Photo Memory — 9 Pairs</h1>
          <p class="text-sm text-gray-400">Flip and match all pairs to test your visual memory!</p>
        </div>

        <div class="flex items-center gap-3">
          <div class="rounded-xl bg-gray-900/60 backdrop-blur px-4 py-2">
            <div class="text-xs text-gray-400">Time</div>
            <div class="font-semibold tabular-nums">{{ timeDisplay() }}</div>
          </div>
          <div class="rounded-xl bg-gray-900/60 backdrop-blur px-4 py-2">
            <div class="text-xs text-gray-400">Moves</div>
            <div class="font-semibold tabular-nums">{{ moves() }}</div>
          </div>
          <button
            (click)="reset()"
            class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[.98] px-4 py-2 text-sm font-semibold shadow-lg shadow-indigo-600/20 transition"
          >
            🔄 Restart
          </button>
        </div>
      </header>

      <!-- Grid -->
      <main class="w-full max-w-4xl">
        <div class="grid grid-cols-6 sm:grid-cols-6 gap-3 md:gap-4"
             [class.pointer-events-none]="boardLocked()">
          <button
            *ngFor="let c of cards(); trackBy: trackCard"
            (click)="onCardClick(c)"
            [disabled]="c.flipped || c.matched"
            class="group relative aspect-square select-none focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-2xl"
          >
            <div class="relative h-full w-full preserve-3d transition-transform duration-300 [transform-style:preserve-3d]"
                 [class.rotate-y-180]="c.flipped || c.matched">
              <!-- Back -->
              <div class="absolute inset-0 backface-hidden rounded-2xl bg-gradient-to-br from-gray-800 to-gray-900 border border-white/5
                          shadow-lg shadow-black/30 flex items-center justify-center">
                <span class="text-[10px] sm:text-sm font-semibold tracking-wider text-gray-300">Flip</span>
              </div>

              <!-- Front -->
              <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-2xl overflow-hidden border border-white/10 shadow-xl shadow-black/40">
                <img [src]="c.image" alt="photo" class="h-full w-full object-cover">
                <div class="absolute inset-0" [class]="c.matched ? 'ring-4 ring-emerald-400/70' : 'ring-0'"></div>
              </div>
            </div>
          </button>
        </div>
      </main>

      <!-- Win Modal -->
      <div *ngIf="won()" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="w-full max-w-md rounded-2xl bg-gray-900 border border-white/10 p-6 text-center">
          <h2 class="text-xl md:text-2xl font-extrabold mb-2">🎉 You Matched All!</h2>
          <p class="text-gray-300 mb-4">Time: <span class="font-semibold">{{ timeDisplay() }}</span> • Moves: <span class="font-semibold">{{ moves() }}</span></p>
          <button (click)="reset()" class="rounded-xl bg-indigo-600 hover:bg-indigo-500 px-5 py-2 font-semibold shadow-lg shadow-indigo-600/20">Play Again</button>
        </div>
      </div>

      <!-- Footer -->
      <p class="mt-6 text-center text-xs text-gray-500">9 pairs. First flip starts timer.</p>
    </div>
